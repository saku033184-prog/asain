<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>アサイン時間管理</title>
  <style>
    :root{--black:#0a0a0a;--yellow:#ffca43;--green:#48c63e;--pink:#ff2e83;--soft:#f3f3f3;--danger:#ff2d20}
    *{box-sizing:border-box}
    html,body{margin:0;background:white;color:var(--black);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif}
    body{min-height:100vh}
    .app{width:min(100%,760px);margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 14px calc(36px + env(safe-area-inset-bottom))}
    .topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.97);backdrop-filter:blur(10px);padding:10px 0 12px;border-bottom:4px solid var(--black)}
    .title{font-size:clamp(22px,6vw,34px);font-weight:1000;letter-spacing:.02em;margin:0 0 4px}
    .clock-label{font-size:12px;font-weight:900;letter-spacing:.12em;color:#555}
    .clock{font-size:clamp(30px,8vw,48px);line-height:1;font-weight:1000;font-variant-numeric:tabular-nums;white-space:nowrap}
    .summary{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:10px;font-weight:900;font-size:13px;flex-wrap:wrap}
    .chip{border:3px solid var(--black);border-radius:999px;padding:5px 10px;background:#fff}
    .soundbtn{border:3px solid var(--black);border-radius:999px;padding:5px 10px;background:#fff;font-weight:1000;font-size:13px;box-shadow:0 2px 0 var(--black)}
    .soundbtn.on{background:#dfffdc}
    .list{display:grid;gap:14px;margin:16px 0 22px}
    .empty{border:4px dashed #bbb;border-radius:24px;padding:34px 20px;text-align:center;font-weight:900;color:#777;line-height:1.7}
    .card{border:6px solid var(--black);border-radius:28px;padding:16px;background:#fff;display:grid;grid-template-columns:1fr auto;gap:12px;box-shadow:0 5px 0 var(--black);position:relative;overflow:hidden}
    .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:11px;background:var(--tcolor,#ddd)}
    .card.urgent{background:#fff4f3;animation:urgentBlink .75s steps(2,end) infinite}
    .card.overdue{background:#ffe5e2;animation:none}
    @keyframes urgentBlink{0%,49%{box-shadow:0 5px 0 var(--black),inset 0 0 0 6px var(--danger)}50%,100%{box-shadow:0 5px 0 var(--black)}}
    .main{min-width:0;padding-left:5px}
    .tournament{display:inline-block;font-size:clamp(25px,7vw,39px);font-weight:1000;line-height:1.05;overflow-wrap:anywhere;margin-bottom:8px;padding:5px 10px;border-radius:12px;background:var(--tcolor,#eee)}
    .tables-label{font-size:12px;font-weight:1000;color:#666;margin-top:2px}
    .tables{font-size:clamp(34px,9vw,56px);font-weight:1000;line-height:1.02;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;margin-bottom:12px;letter-spacing:-.02em}
    .when{font-size:13px;font-weight:900;color:#555;margin-bottom:6px}
    .countdown{display:inline-block;position:relative;font-size:clamp(30px,7.7vw,45px);font-weight:1000;line-height:1.05;font-variant-numeric:tabular-nums;padding:2px 4px 4px;z-index:1}
    .countdown::after{content:"";position:absolute;z-index:-1;left:-3px;right:-3px;bottom:3px;height:13px;background:var(--pink);transform:rotate(-1.5deg);border-radius:60% 42% 45% 55% / 48% 55% 42% 50%;opacity:.95}
    .countdown.over{color:var(--danger)}
    .buttons{display:flex;flex-direction:column;gap:10px;justify-content:center}
    button{font:inherit;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
    .action{min-width:92px;padding:14px 13px;border-radius:16px;font-weight:1000;font-size:24px;border:4px solid transparent;box-shadow:0 3px 0 rgba(0,0,0,.18)}
    .done{background:var(--yellow);color:#fff}.edit{background:var(--green);color:#fff}
    .action:active,.soundbtn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
    .form-card,.paste-card{border:6px solid var(--black);border-radius:28px;padding:18px;background:#fff;box-shadow:0 5px 0 var(--black);scroll-margin-top:150px;margin-top:18px}
    .form-title{font-size:30px;font-weight:1000;margin:0 0 8px}.sub{font-size:13px;font-weight:800;color:#666;margin:0 0 14px;line-height:1.5}
    .fields{display:grid;gap:13px}
    label{display:grid;gap:6px;font-size:14px;font-weight:1000}
    input,textarea{width:100%;border:4px solid var(--black);border-radius:15px;padding:13px 14px;background:#fff;color:var(--black);font:inherit;font-size:20px;font-weight:900;outline:none}
    textarea{min-height:190px;resize:vertical;font-size:17px;line-height:1.5;font-weight:800}
    input:focus,textarea:focus{box-shadow:0 0 0 4px rgba(255,46,131,.18)}
    .hint{font-size:12px;color:#666;font-weight:800;margin-top:-3px;line-height:1.45}
    .form-actions{display:grid;grid-template-columns:1fr;gap:10px;margin-top:16px}
    .primary{background:var(--black);color:#fff;border-radius:16px;padding:15px 18px;font-weight:1000;font-size:23px}
    .paste-primary{background:#ff2e83}
    .cancel{background:var(--soft);color:var(--black);border:4px solid var(--black);border-radius:16px;padding:11px 16px;font-weight:1000;font-size:18px;display:none}
    .editing .cancel{display:block}
    .preview{margin-top:12px;border:3px dashed #aaa;border-radius:14px;padding:10px 12px;font-size:13px;font-weight:900;line-height:1.55;display:none;background:#fafafa}
    .toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(120px);background:var(--black);color:#fff;border-radius:999px;padding:11px 16px;font-weight:900;transition:.25s;z-index:50;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
    .toast.show{transform:translateX(-50%) translateY(0)}
    @media (max-width:430px){
      .app{padding-left:10px;padding-right:10px}.card{grid-template-columns:minmax(0,1fr) 84px;padding:13px;border-width:5px;border-radius:24px}.buttons{gap:8px}.action{min-width:76px;padding:12px 8px;font-size:21px;border-radius:14px}.form-card,.paste-card{border-width:5px;border-radius:24px}.summary{gap:6px}.chip,.soundbtn{font-size:12px;padding:5px 8px}
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="topbar">
      <h1 class="title">アサイン時間管理</h1>
      <div class="clock-label">現在時刻</div>
      <div id="clock" class="clock">--:--:--</div>
      <div class="summary">
        <span id="countChip" class="chip">登録 0件</span>
        <span id="nextChip" class="chip">次のアサイン --</span>
        <button id="soundBtn" class="soundbtn" type="button">🔇 音OFF</button>
      </div>
    </section>

    <section id="list" class="list"></section>

    <section class="paste-card">
      <h2 class="form-title">文章コピペ登録</h2>
      <p class="sub">LINEなどでもらった依頼文をそのまま貼ってOK。トナメ名・卓番号・時間を自動で読み取るよ。</p>
      <textarea id="pasteText" placeholder="例：&#10;メイン&#10;427-430&#10;431-435&#10;437-440&#10;17:20&#10;でお願いします！！"></textarea>
      <div id="pastePreview" class="preview"></div>
      <div class="form-actions">
        <button id="pasteRegisterBtn" class="primary paste-primary" type="button">文章から読み取って登録</button>
      </div>
    </section>

    <section id="formCard" class="form-card">
      <h2 id="formTitle" class="form-title">手動で新規登録</h2>
      <form id="assignForm" autocomplete="off">
        <div class="fields">
          <label>トーナメント名<input id="tournament" maxlength="60" placeholder="例：メインDAY3" required /></label>
          <label>アサイン卓<input id="tables" maxlength="200" placeholder="例：303,304,305,306" required /><span class="hint">「427-430」「100,103,104,503」どちらもOK</span></label>
          <label>アサイン時間<input id="assignAt" type="datetime-local" step="1" /></label>
        </div>
        <div class="form-actions">
          <button id="submitBtn" class="primary" type="submit">登録</button>
          <button id="cancelBtn" class="cancel" type="button">編集をやめる</button>
        </div>
      </form>
    </section>
  </main>
  <div id="toast" class="toast" role="status"></div>

  <script>
    const STORAGE_KEY='assignTimerItemsV3', SOUND_KEY='assignTimerSoundV1';
    // iPhoneのファイルプレビュー等でlocalStorageが使えない場合でも、アプリ自体は止めない
    const memoryStore={};
    let storageOK=true;
    const safeStorage={
      get(key){try{return localStorage.getItem(key)}catch(e){storageOK=false;return memoryStore[key]??null}},
      set(key,val){try{localStorage.setItem(key,val)}catch(e){storageOK=false;memoryStore[key]=String(val)}}
    };
    let items=loadItems(), editingId=null, audioCtx=null, soundOn=safeStorage.get(SOUND_KEY)==='1';
    const $=id=>document.getElementById(id), listEl=$('list'), formCard=$('formCard'), form=$('assignForm');
    const tournamentInput=$('tournament'), tablesInput=$('tables'), assignAtInput=$('assignAt'), formTitle=$('formTitle'), submitBtn=$('submitBtn'), cancelBtn=$('cancelBtn');

    function loadItems(){try{return JSON.parse(safeStorage.get(STORAGE_KEY)||safeStorage.get('assignTimerItemsV2')||safeStorage.get('assignTimerItemsV1')||'[]').map(x=>({...x,alarmed:!!x.alarmed}))}catch{return[]}}
    function saveItems(){safeStorage.set(STORAGE_KEY,JSON.stringify(items))}
    const pad=n=>String(n).padStart(2,'0');
    function formatClock(d){return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`}
    function localInputValue(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`}
    function formatWhen(ms){const d=new Date(ms);return `${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`}
    function formatRemaining(ms){const over=ms<0;let t=Math.floor(Math.abs(ms)/1000),days=Math.floor(t/86400);t%=86400;const h=Math.floor(t/3600);t%=3600;const m=Math.floor(t/60),s=t%60;const v=days?`${days}日 ${pad(h)}:${pad(m)}:${pad(s)}`:`${pad(h)}:${pad(m)}:${pad(s)}`;return over?`${v} 超過`:`${v} 後まで`}
    function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
    function normalizeTables(s){return s.trim().replace(/[、，]/g,',').replace(/[〜～]/g,'-').replace(/\s+/g,'').replace(/\.+/g,',').replace(/,+/g,',')}
    function tournamentColor(name){let h=0;for(const ch of name)h=(h*31+ch.charCodeAt(0))%360;return `hsl(${h} 82% 82%)`}

    function render(){
      const now=Date.now();items.sort((a,b)=>(a.assignAt??Infinity)-(b.assignAt??Infinity));$('countChip').textContent=`登録 ${items.length}件`;
      const next=items.find(i=>i.assignAt!=null&&i.assignAt>=now);$('nextChip').textContent=next?`次 ${formatRemaining(next.assignAt-now).replace(' 後まで','')}`:(items.length?'すべて時間超過':'次のアサイン --');
      if(!items.length){listEl.innerHTML='<div class="empty">まだ登録がありません♡<br>下から追加してね</div>';return}
      listEl.innerHTML=items.map(item=>{const hasTime=item.assignAt!=null&&Number.isFinite(item.assignAt),diff=hasTime?item.assignAt-now:null,urgent=hasTime&&diff>=0&&diff<=5*60*1000,over=hasTime&&diff<0,color=tournamentColor(item.tournament);return `<article class="card ${urgent?'urgent':''} ${over?'overdue':''}" style="--tcolor:${color}" data-id="${item.id}"><div class="main"><div class="tournament">${escapeHtml(item.tournament)}</div><div class="tables-label">アサイン卓</div><div class="tables">${escapeHtml(item.tables)}</div><div class="when">${hasTime?'アサイン '+formatWhen(item.assignAt):'アサイン時間 未設定'}</div><div class="countdown ${over?'over':''}" ${hasTime?`data-countdown="${item.id}"`:''}>${hasTime?formatRemaining(diff):'時間未設定'}</div></div><div class="buttons"><button class="action done" data-action="done" data-id="${item.id}" type="button">済</button><button class="action edit" data-action="edit" data-id="${item.id}" type="button">変更</button></div></article>`}).join('')
    }

    async function initAudio(){
      if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
      if(audioCtx.state==='suspended') try{await audioCtx.resume()}catch{}
    }
    function beep(){
      if(!soundOn)return;initAudio().then(()=>{if(!audioCtx)return;const now=audioCtx.currentTime;[0,.28,.56].forEach((offset,i)=>{const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.frequency.value=i===1?880:1046;osc.type='sine';gain.gain.setValueAtTime(.0001,now+offset);gain.gain.exponentialRampToValueAtTime(.28,now+offset+.02);gain.gain.exponentialRampToValueAtTime(.0001,now+offset+.22);osc.connect(gain);gain.connect(audioCtx.destination);osc.start(now+offset);osc.stop(now+offset+.24)})})
    }
    function updateSoundBtn(){$('soundBtn').textContent=soundOn?'🔊 音ON':'🔇 音OFF';$('soundBtn').classList.toggle('on',soundOn)}
    $('soundBtn').addEventListener('click',async()=>{soundOn=!soundOn;safeStorage.set(SOUND_KEY,soundOn?'1':'0');if(soundOn){await initAudio();beep();toast('通知音をONにしました')}else toast('通知音をOFFにしました');updateSoundBtn()});

    function tick(){
      const now=new Date(),nowMs=now.getTime();$('clock').textContent=formatClock(now);
      let changed=false;
      document.querySelectorAll('[data-countdown]').forEach(el=>{const item=items.find(i=>i.id===el.dataset.countdown);if(!item)return;const diff=item.assignAt-nowMs;el.textContent=formatRemaining(diff);el.classList.toggle('over',diff<0);const card=el.closest('.card');card.classList.toggle('urgent',diff>=0&&diff<=5*60*1000);card.classList.toggle('overdue',diff<0);if(diff<=0&&!item.alarmed){item.alarmed=true;changed=true;beep();toast(`${item.tournament} ${item.tables} アサイン時間！`)}});
      if(changed)saveItems();
      const next=items.filter(i=>i.assignAt!=null&&i.assignAt>=nowMs).sort((a,b)=>a.assignAt-b.assignAt)[0];$('nextChip').textContent=next?`次 ${formatRemaining(next.assignAt-nowMs).replace(' 後まで','')}`:(items.length?'すべて時間超過':'次のアサイン --')
    }
    function toast(msg){const el=$('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),1800)}

    listEl.addEventListener('click',e=>{const btn=e.target.closest('button[data-action]');if(!btn)return;initAudio();const id=btn.dataset.id;if(btn.dataset.action==='done'){const card=btn.closest('.card');card.style.transition='.2s';card.style.opacity='0';card.style.transform='scale(.97)';setTimeout(()=>{items=items.filter(i=>i.id!==id);if(editingId===id)resetForm();saveItems();render();toast('済にしました')},180)}else startEdit(id)});
    function startEdit(id){const item=items.find(i=>i.id===id);if(!item)return;editingId=id;tournamentInput.value=item.tournament;tablesInput.value=item.tables;assignAtInput.value=item.assignAt!=null?localInputValue(new Date(item.assignAt)):'';formTitle.textContent='登録内容を変更';submitBtn.textContent='変更を保存';formCard.classList.add('editing');formCard.scrollIntoView({behavior:'smooth',block:'start'});setTimeout(()=>tournamentInput.focus(),450)}
    function resetForm(){editingId=null;form.reset();formTitle.textContent='手動で新規登録';submitBtn.textContent='登録';formCard.classList.remove('editing');setDefaultTime()}
    form.addEventListener('submit',e=>{e.preventDefault();initAudio();const tournament=tournamentInput.value.trim(),tables=normalizeTables(tablesInput.value),assignAt=assignAtInput.value?new Date(assignAtInput.value).getTime():null;if(!tournament||!tables||(assignAt!=null&&Number.isNaN(assignAt)))return;if(editingId){const idx=items.findIndex(i=>i.id===editingId);if(idx>=0)items[idx]={...items[idx],tournament,tables,assignAt,alarmed:false};toast('変更しました')}else{items.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()),tournament,tables,assignAt,alarmed:false});toast('登録しました')}saveItems();resetForm();render();window.scrollTo({top:0,behavior:'smooth'})});
    cancelBtn.addEventListener('click',resetForm);
    function setDefaultTime(){if(assignAtInput.value)return;const d=new Date(Date.now()+10*60*1000);d.setMilliseconds(0);assignAtInput.value=localInputValue(d)}

    function tableTextOnly(line){
      let s=line.trim()
        .replace(/^(?:テーブル|卓)\s*[：:]?\s*/,'')
        .replace(/[（(]\s*(?:合計)?\s*\d+\s*卓\s*[）)]/g,'')
        .replace(/(?:合計)?\s*\d+\s*卓\s*$/,'')
        .trim();
      return s
    }
    function isTableLine(line){
      let s=tableTextOnly(line)
        .replace(/\s+/g,'')
        .replace(/[、，]/g,',')
        .replace(/[〜～]/g,'-');
      return /^(?:\d{1,4}(?:-\d{1,4})?)(?:[,\.]+\d{1,4}(?:-\d{1,4})?)*[,\.]?$/.test(s)
    }

    function extractTables(line){
      const s=tableTextOnly(line);
      return isTableLine(s)?normalizeTables(s):''
    }

    function parseTime(line){
      let m=line.match(/(?:アサイン時刻\s*[：:]?\s*)?([01]?\d|2[0-3])[:：]([0-5]\d)/);
      if(!m)m=line.match(/([01]?\d|2[0-3])\s*時\s*([0-5]?\d)\s*分/);
      return m?{h:+m[1],m:+m[2]}:null
    }
    function cleanTitle(line){
      return line.replace(/^(?:トナメ名|トーナメント名)\s*[：:]\s*/,'').replace(/[：:]$/,'').trim()
    }
    function parsePaste(text){
      const raw=text.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
      const blocks=[];let cur={title:'',tables:[],time:null};
      const push=()=>{if(cur.title||cur.tables.length||cur.time)blocks.push(cur);cur={title:'',tables:[],time:null}};
      for(const line of raw){
        const explicitTitle=line.match(/^(?:トナメ名|トーナメント名)\s*[：:]\s*(.+)$/);
        if(explicitTitle){if(cur.title&&cur.tables.length)push();cur.title=cleanTitle(explicitTitle[1]);continue}
        if(/^【.*(?:依頼|新規).*】$/.test(line))continue;
        const tm=parseTime(line);
        if(tm){cur.time=tm;push();continue}
        const tbl=extractTables(line);
        if(tbl){cur.tables.push(tbl);continue}
        if(/お願い|よろしく|アサインお願いします|でお願いします/i.test(line))continue;
        if(!cur.title){cur.title=cleanTitle(line);continue}
        if(cur.title&&cur.tables.length){push();cur.title=cleanTitle(line);continue}
        cur.title=cleanTitle(line)
      }
      push();
      // 時刻なしブロックは、同じトナメ名の直後/後続ブロックの時刻を引き継ぐ。
      for(let i=0;i<blocks.length;i++)if(!blocks[i].time&&blocks[i].title){
        const same=blocks.slice(i+1).find(b=>b.time&&b.title.toLowerCase()===blocks[i].title.toLowerCase());
        if(same)blocks[i].time=same.time
      }
      const grouped=[];
      for(const b of blocks){
        if(!b.title||!b.tables.length)continue;
        const key=b.title.toLowerCase()+'|'+(b.time?b.time.h+':'+b.time.m:'notime');
        let g=grouped.find(x=>x.key===key);
        if(!g){g={key,title:b.title,tables:[],time:b.time||null};grouped.push(g)}
        g.tables.push(...b.tables)
      }
      return grouped.map(g=>{let assignAt=null;if(g.time){const d=new Date();d.setHours(g.time.h,g.time.m,0,0);if(d.getTime()<Date.now()-6*60*60*1000)d.setDate(d.getDate()+1);assignAt=d.getTime()}return{tournament:g.title,tables:normalizeTables(g.tables.join(',')),assignAt}})
    }
    function showPastePreview(){const parsed=parsePaste($('pasteText').value);const p=$('pastePreview');if(!$('pasteText').value.trim()){p.style.display='none';return}p.style.display='block';p.innerHTML=parsed.length?`読み取り：${parsed.map(x=>`<b>${escapeHtml(x.tournament)}</b> / 卓 ${escapeHtml(x.tables)} / ${x.assignAt!=null?formatWhen(x.assignAt):'<b>時間未設定</b>'}`).join('<br>')}`:'うまく読み取れませんでした。トナメ名 → 卓番号 → 時間 の順で貼ってみてね。'}
    $('pasteText').addEventListener('input',showPastePreview);
    $('pasteRegisterBtn').addEventListener('click',()=>{initAudio();const parsed=parsePaste($('pasteText').value);if(!parsed.length){toast('読み取れるアサインがありません');showPastePreview();return}parsed.forEach(x=>items.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()),...x,alarmed:false}));saveItems();$('pasteText').value='';$('pastePreview').style.display='none';render();toast(`${parsed.length}件 登録しました`);window.scrollTo({top:0,behavior:'smooth'})});

    updateSoundBtn();setDefaultTime();render();tick();
    if(!storageOK){
      toast('この表示方法では保存が制限されています。登録操作はできます');
      $('countChip').title='ブラウザの保存機能が制限されています';
    }
    setInterval(tick,250);
  </script>
</body>
</html>
